name: Setup
description: Install pnpm, Node.js and dependencies

runs:
  using: composite
  steps:
    # `runtime` duplicates .node-version because v3.0.0, which detects that file
    # on its own, is still inside pinact's 7-day cooldown. Drop it on the v3 bump.
    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24
        cache: true
        require-lockfile: true
