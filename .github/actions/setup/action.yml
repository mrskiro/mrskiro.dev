name: Setup
description: Install pnpm, Node.js and dependencies

runs:
  using: composite
  steps:
    # pnpm comes from packageManager, Node.js from .node-version — both detected.
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        require-lockfile: true
